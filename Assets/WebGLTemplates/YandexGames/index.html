<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Последний солдат: другой мир</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./style.css">

    <!-- Yandex Games SDK -->
    <script src="/sdk.js"></script>

    <style>
        canvas:focus {
            outline: none;
        }

        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
        }
    </style>

    <!-- Additional head modules -->

</head>
<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">

    <div id="orientation-cover" role="status" aria-live="polite" hidden>
        <div class="orientation-card">
            <div class="orientation-phone" aria-hidden="true"><span>↻</span></div>
            <h1>Поверните телефон</h1>
            <p>Для игры нужен альбомный режим.</p>
        </div>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="Images/logo.png"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Additional body modules -->

    <script>
        const hideFullScreenButton = "";
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        const config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            #if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
            #endif
        #if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
            #endif
        streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');
        const orientationCover = document.querySelector('#orientation-cover');

        const canFullscreen = (function () {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
            ]) {
                if (key in document) {
                    return true;
                }
            }
            return false;
        }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            //config.devicePixelRatio = 1;
        }

        // The background image when loading the game. When building a build, the code changes depending on the project settings.
#if BACKGROUND_FILENAME
        var backgroundUnity = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
        loadingCover.style.background = "url('Images/background.png') center / cover";
        loadingCover.style.display = "";

        let StartUnityInstance;
        let ygGameInstance = null;
        let ysdk = null;
        let initYSDK = false;
        let initGame = false;
        let syncInit = false;
        let isVisibility = !document.hidden;
        let isPausedGame = false;
        let isOrientationBlocked = false;
        const NO_DATA = 'no data';

        function IsMobileOrientationDevice() {
            return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
                || Boolean(navigator.userAgentData && navigator.userAgentData.mobile)
                || (navigator.maxTouchPoints > 0 && typeof window.matchMedia === 'function'
                    && window.matchMedia('(pointer: coarse)').matches)
                || Boolean(ysdk && ysdk.deviceInfo && (ysdk.deviceInfo.isMobile() || ysdk.deviceInfo.isTablet()));
        }

        function IsPortraitScreen() {
            // The platform may fit a landscape iframe inside a portrait phone viewport.
            // Prefer the physical screen orientation over the iframe's aspect ratio.
            const type = window.screen && window.screen.orientation && window.screen.orientation.type;
            if (typeof type === 'string' && /^(portrait|landscape)/.test(type))
                return type.startsWith('portrait');
            if (typeof window.orientation === 'number')
                return Math.abs(window.orientation) % 180 === 0;
            if (window.screen && window.screen.width > 0 && window.screen.height > 0
                && window.screen.width !== window.screen.height)
                return window.screen.height > window.screen.width;
            return window.innerHeight > window.innerWidth;
        }

        function SyncGamePause() {
            if (!initGame || ygGameInstance === null) return;
            const paused = isPausedGame || isOrientationBlocked || !isVisibility || document.hidden;
            YG2Instance('SetPauseGame', paused ? 'true' : 'false');
        }

        function UpdateMobileOrientation() {
            const blocked = IsMobileOrientationDevice() && IsPortraitScreen();
            orientationCover.hidden = !blocked;
            if (isOrientationBlocked === blocked) return;
            isOrientationBlocked = blocked;
            SyncGamePause();
            if (!blocked) FocusGame();
        }

        window.addEventListener('resize', UpdateMobileOrientation);
        window.addEventListener('orientationchange', UpdateMobileOrientation);
        if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener)
            window.screen.orientation.addEventListener('change', UpdateMobileOrientation);
        if (window.visualViewport)
            window.visualViewport.addEventListener('resize', UpdateMobileOrientation);
        UpdateMobileOrientation();

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
        window.addEventListener('blur', () => SetVisibility(false));
        window.addEventListener('focus', () => SetVisibility(true));

        window.addEventListener('pointerdown', () => {
            FocusGame();
            SetVisibility(true);
        });

        window.addEventListener('resize', () => FocusGame());
        document.addEventListener('fullscreenchange', () => FocusGame());

        const oRequestPointerLock = Element.prototype.requestPointerLock;
        Element.prototype.requestPointerLock = async function hkRequestPointerLock(...args) {
            try {
                (args[0] ||= {}).unadjustedMovement = true;
                await oRequestPointerLock.apply(this, args);
            } catch (err) {
                console.log(err);
            }
        };

        function InstallBlurFocusBlocker() {
            if (!('onblur' in document)) return;
            if (window.blurFocusHandlersInstalled) return;

            window.addEventListener('blur', function () {
                let blockerButton = document.createElement('button');
                blockerButton.style.position = 'fixed';
                blockerButton.style.top = '0';
                blockerButton.style.left = '0';
                blockerButton.style.width = '100%';
                blockerButton.style.height = '100%';
                blockerButton.style.zIndex = '9999';
                blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                blockerButton.style.border = 'none';
                blockerButton.style.cursor = 'default';

                document.body.appendChild(blockerButton);

                function removeBlocker() {
                    if (blockerButton && blockerButton.parentNode) {
                        blockerButton.parentNode.removeChild(blockerButton);
                    }
                    window.removeEventListener('focus', removeBlocker);
                }

                window.addEventListener('focus', removeBlocker);
            });

            window.blurFocusHandlersInstalled = true;
        }

        function FocusGame(checkingPauseStatus = true) {
            if (!canvas) return;

            requestAnimationFrame(() => {
                if (isOrientationBlocked || !isVisibility || document.hidden || (checkingPauseStatus && isPausedGame)) return;

                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' ||
                    active.tagName === 'TEXTAREA' ||
                    active.isContentEditable
                )) {
                    return;
                }

                canvas.focus({ preventScroll: true });
            });
        }

        function SetVisibility(visibility) {
            visibility = Boolean(visibility) && !document.hidden;
            if (isVisibility !== visibility) {
                isVisibility = visibility;
                if (ysdk !== null && initGame === true) {
                    YG2Instance('SetFocusWindowGame', visibility ? 'true' : 'false');
                }
                SyncGamePause();
            }
        }

        const PauseCallback = () => {
            isPausedGame = true;
            SyncGamePause();
        };

        const ResumeCallback = () => {
            isPausedGame = false;
            SyncGamePause();
            FocusGame(false);
        };

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            StartUnityInstance = function () {
                createUnityInstance(canvas, config, (progress) => {
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    const adjustedProgress = Math.max(progress, 0.05);
                    progressBarFull.style.width = `${100 * adjustedProgress}%`;
                }).then((unityInstance) => {
                    ygGameInstance = unityInstance;
                    loadingCover.style.background = "";
                    loadingCover.style.display = "none";
                    FocusGame();
                    // Fill Background [Build Modify]
                }).catch((message) => {
                    console.error(message);
                });
            };
            
            InstallBlurFocusBlocker();
            InitYSDK();
            
            if (IsLocalHost() || syncInit)
                StartUnityInstance_IfUnloaded();
        };

        function StartUnityInstance_IfUnloaded() {
            if (spinner.style.display !== "none")
                StartUnityInstance();
        }

        function IsLocalHost() {
            try {
                if (window.top !== window) {
                    return false;
                }

                const host = window.location.hostname;
                if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) {
                    LogStyledMessage("Local Host");
                    return true;
                }
            } 
            catch (error) {
                console.error("Error checking the local host:", error);
                return false;
            }
        }

        function YG2Instance(method) {
            if (ygGameInstance == null)
                return;

            if (!initGame) {
                setTimeout(function () {
                    if (ygGameInstance)
                        ygGameInstance.SendMessage('YG2Instance', method);
                }, 100);
            }
            else {
                ygGameInstance.SendMessage('YG2Instance', method);
            }
                
        }
        function YG2Instance(method, arg) {
            if (ygGameInstance == null)
                return;

            if (!initGame) {
                setTimeout(function () {
                    ygGameInstance.SendMessage('YG2Instance', method, arg);
                }, 100);
            }
            else {
                ygGameInstance.SendMessage('YG2Instance', method, arg);
            }
        }

        function LogStyledMessage(message, style = 'color: #FFDF73; background-color: #454545') {
            console.log('%c' + message, style);
        }

        async function InitYSDK() {
            try {
                if (IsLocalHost()) return;

                ysdk = await YaGames.init();
                if (ysdk.deviceInfo && (ysdk.deviceInfo.isMobile() || ysdk.deviceInfo.isTablet())) {
                    container.className = "unity-mobile";
                }
                UpdateMobileOrientation();
                ysdk.on('game_api_pause', PauseCallback);
                ysdk.on('game_api_resume', ResumeCallback);

                // Additional init0 modules

                // Additional init1 modules

                // Additional init2 modules

                // Additional init modules

                initYSDK = true;
                if (ygGameInstance != null)
                    ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');

                LogStyledMessage('Init YandexSDK Success');

            } catch (e) {
                console.error('CRASH Initialization SDK: ', e);
            }

            if (!IsLocalHost() && !syncInit)
                StartUnityInstance_IfUnloaded();
        }

        function InitGame() {
            initGame = true;
            UpdateMobileOrientation();
            if (isPausedGame || isOrientationBlocked || !isVisibility || document.hidden)
                SyncGamePause();

            setTimeout(function () {
                UpdateMobileOrientation();
                if (!isVisibility) YG2Instance('SetFocusWindowGame', 'false');
                if (isPausedGame || isOrientationBlocked || !isVisibility || document.hidden)
                    SyncGamePause();
            }, 100);

            // Additional start modules
        }

        // Additional script modules

        document.body.appendChild(script);
    </script>
</body>
</html>
